name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must satisfy jsdom's engines (^22.22.2 || ^24.15.0 || >=26).
          # Node 20 could not import jsdom at all — undici 8 calls
          # webidl.util.markAsUncloneable, which does not exist there, so
          # the smoke test died at collection while the rest went green.
          # Keep this matching the development Node version.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Placeholder values only — this job proves the build compiles, it does
      # not produce the artifact that ships. The deploy job rebuilds with the
      # real project credentials.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  deploy:
    # The live demo drifted eleven days behind main because CI built the site
    # and then threw it away. Deploying from the same pipeline that gates it is
    # the only reliable way to keep the URL and the repo saying the same thing.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://luxuryphotoenhancer-demo.davidmasterson.co
    steps:
      - uses: actions/checkout@v4
      # Fail here rather than three steps later with an opaque CLI error.
      # Deliberately does not skip silently: a deploy that quietly does
      # nothing is what let the live site drift in the first place.
      - name: Check deploy secrets are configured
        run: |
          missing=""
          [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "${{ secrets.NETLIFY_SITE_ID }}" ] || missing="$missing NETLIFY_SITE_ID"
          [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "NETLIFY_AUTH_TOKEN: Netlify > User settings > Applications > New access token"
            echo "NETLIFY_SITE_ID:    Netlify > this site > Site configuration > Site ID"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          # Must satisfy jsdom's engines (^22.22.2 || ^24.15.0 || >=26).
          # Node 20 could not import jsdom at all — undici 8 calls
          # webidl.util.markAsUncloneable, which does not exist there, so
          # the smoke test died at collection while the rest went green.
          # Keep this matching the development Node version.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
