name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Must satisfy jsdom's engines (^22.22.2 || ^24.15.0 || >=26).
          # Node 20 could not import jsdom at all — undici 8 calls
          # webidl.util.markAsUncloneable, which does not exist there, so
          # the smoke test died at collection while the rest went green.
          # Keep this matching the development Node version.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Placeholder values only — this job proves the build compiles, it does
      # not produce the artifact that ships. The deploy job rebuilds with the
      # real project credentials.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  deploy:
    # The live demo drifted eleven days behind main because CI built the site
    # and then threw it away. Deploying from the same pipeline that gates it is
    # the only reliable way to keep the URL and the repo saying the same thing.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://luxuryphotoenhancer-demo.davidmasterson.co
    steps:
      - uses: actions/checkout@v5
      # Fail here rather than three steps later with an opaque CLI error.
      # Deliberately does not skip silently: a deploy that quietly does
      # nothing is what let the live site drift in the first place.
      - name: Check deploy secrets are configured
        run: |
          missing=""
          [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "${{ secrets.NETLIFY_SITE_ID }}" ] || missing="$missing NETLIFY_SITE_ID"
          [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "NETLIFY_AUTH_TOKEN: Netlify > User settings > Applications > New access token"
            echo "NETLIFY_SITE_ID:    Netlify > this site > Site configuration > Site ID"
            exit 1
          fi

      # [!] Same assertion as deploy-functions. Duplicated on purpose, in the
      # spirit of models.ts/guards.ts/budget.ts: change one, change both.
      #
      # It has to be in BOTH jobs, not one. These two deploys are independent
      # by design (see deploy-functions) and run in parallel, so guarding only
      # the functions job would have produced precisely today's outcome — a red
      # functions run sitting next to a green Netlify deploy that shipped a
      # front end wired to a project that no longer exists. The visitor sees the
      # front end, not the red X.
      - name: Verify the Supabase URL matches the repo's project
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          ref=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')
          cfg=$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([a-z0-9]+)".*/\1/p' supabase/config.toml)
          if [ -z "$ref" ]; then
            echo "::error::Could not parse a project ref from VITE_SUPABASE_URL."
            echo "Expected the form https://<ref>.supabase.co"
            exit 1
          fi
          if [ -z "$cfg" ]; then
            echo "::error::Could not read project_id from supabase/config.toml."
            exit 1
          fi
          if [ "$ref" != "$cfg" ]; then
            echo "::error::VITE_SUPABASE_URL points at '$ref' but supabase/config.toml says '$cfg'."
            echo "One of them is stale. Fix before deploying the front end."
            exit 1
          fi
          echo "Building against project $ref (matches config.toml)"

      - uses: actions/setup-node@v5
        with:
          # Must satisfy jsdom's engines (^22.22.2 || ^24.15.0 || >=26).
          # Node 20 could not import jsdom at all — undici 8 calls
          # webidl.util.markAsUncloneable, which does not exist there, so
          # the smoke test died at collection while the rest went green.
          # Keep this matching the development Node version.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-functions:
    # The edge functions had the drift problem worse than the front end: they
    # were deployed by hand through the dashboard, so nothing shipped them from
    # the repo at all. A retired model ID sat in validate-image for months and
    # the only reason nobody noticed is that the backend was gone too.
    #
    # Independent of the Netlify job on purpose. A failure to ship functions
    # should not hold back the front end, and neither should the reverse.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check function deploy secrets are configured
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || missing="$missing VITE_SUPABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "SUPABASE_ACCESS_TOKEN: Supabase > Account > Access Tokens"
            echo "VITE_SUPABASE_URL:     Supabase > project > Settings > API"
            exit 1
          fi

      # The ref lives in two places and will continue to. What broke the front
      # end was not the duplication — it was that nothing ever compared the two
      # copies, so a stale secret went unnoticed until the demo was dead.
      # Deriving the flag from the secret does not fix that; it only decides
      # which copy silently wins. So: assert instead.
      #
      # Blast radius is why this matters more here than for the front end. A
      # stale secret gave us a dead front end. The same stale secret in this
      # job means deploying edge functions to whatever project that ref names.
      # Today that ref is a deleted project and the CLI fails loudly. It would
      # not have to be — a live project belonging to someone else fails silently
      # and successfully. Once the two must agree, which one we derive from
      # stops mattering; the comparison is the point.
      - name: Resolve and verify the target project ref
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          ref=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')
          if [ -z "$ref" ]; then
            echo "::error::Could not parse a project ref from VITE_SUPABASE_URL."
            echo "Expected the form https://<ref>.supabase.co"
            exit 1
          fi
          cfg=$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([a-z0-9]+)".*/\1/p' supabase/config.toml)
          if [ -z "$cfg" ]; then
            echo "::error::Could not read project_id from supabase/config.toml."
            exit 1
          fi
          if [ "$ref" != "$cfg" ]; then
            echo "::error::VITE_SUPABASE_URL points at '$ref' but supabase/config.toml says '$cfg'."
            echo "One of them is stale. Fix before deploying functions."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Deploying functions to project $ref (matches config.toml)"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deployed separately so the log says which one failed. Function settings
      # (notably verify_jwt) come from supabase/config.toml.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy enhance-image --project-ref "$PROJECT_REF"
          supabase functions deploy validate-image --project-ref "$PROJECT_REF"
